services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: voice-chatbot-postgres
    environment:
      POSTGRES_DB: voice_chatbot_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voice-chatbot-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: voice-chatbot-redis
    command: redis-server --requirepass redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - voice-chatbot-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voice-chatbot-backend
    environment:
      - NODE_ENV=development
      - APP_NAME=voice-chatbot
      - APP_VERSION=1.0.0
      - APP_PORT=3000
      - APP_HOST=0.0.0.0
      - DEBUG=true
      
      # Speechmatics Configuration
      - SPEECHMATICS_API_KEY=k3Mec5xjFh8rGsB8uwRWQeQVyg9D84n5
      - SPEECHMATICS_REGION=us
      - SPEECHMATICS_BATCH_URL=https://asr.api.speechmatics.com/v2
      - SPEECHMATICS_RT_URL=wss://eu2.rt.speechmatics.com/v2
      - SPEECHMATICS_DEFAULT_LANGUAGE=en
      - SPEECHMATICS_ENABLE_PARTIALS=true
      - SPEECHMATICS_MAX_DELAY=5
      - SPEECHMATICS_ENABLE_ENTITIES=true
      - SPEECHMATICS_ENABLE_SENTIMENT=true
      - SPEECHMATICS_ENABLE_TOPICS=true
      - SPEECHMATICS_TTS_ENABLED=true
      - SPEECHMATICS_TTS_VOICE=default
      - SPEECHMATICS_TTS_SPEED=1.0
      - SPEECHMATICS_TTS_PITCH=1.0
      
      # AI Chatbot Configuration
      - KONG_API_URL=https://api.askcollections.com
      - KONG_API_KEY=your-kong-api-key
      - KONG_MODEL_ENDPOINT=/v1/chat/completions
      - KONG_DEFAULT_MODEL=gpt-oss:20b
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_DEFAULT_MODEL=llama2
      - OLLAMA_TIMEOUT=30000
      - OLLAMA_MAX_TOKENS=2000
      - OLLAMA_TEMPERATURE=0.7
      - OPENAI_API_KEY=your-openai-api-key-here
      - OPENAI_MODEL=gpt-4
      - OPENAI_MAX_TOKENS=2000
      - OPENAI_TEMPERATURE=0.7
      - OPENAI_TOP_P=1.0
      - OPENAI_FREQUENCY_PENALTY=0.0
      - OPENAI_PRESENCE_PENALTY=0.0
      - OPENAI_TIMEOUT=30000
      - AI_RESPONSE_MAX_LENGTH=500
      - AI_RESPONSE_TIMEOUT=30000
      - AI_FALLBACK_ENABLED=true
      - AI_FALLBACK_ORDER=kong,ollama,openai
      
      # TTS Configuration
      - TTS_PRIMARY_PROVIDER=speechmatics
      - TTS_SPEECHMATICS_ENABLED=true
      - TTS_FALLBACK_PROVIDER=local
      - TTS_LOCAL_ENABLED=true
      - TTS_LOCAL_ENGINE=espeak
      - TTS_LOCAL_VOICE=en-us
      - TTS_LOCAL_SPEED=150
      - TTS_LOCAL_PITCH=50
      - TTS_AUDIO_FORMAT=wav
      - TTS_SAMPLE_RATE=22050
      - TTS_CHANNELS=1
      - TTS_BIT_DEPTH=16
      
      # Database Configuration
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=voice_chatbot_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres_password
      - DB_SSL=false
      - DB_POOL_MIN=2
      - DB_POOL_MAX=10
      - DB_CONNECTION_TIMEOUT=60000
      
      # Redis Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_password
      - REDIS_DB=0
      - REDIS_POOL_SIZE=10
      - REDIS_CONNECT_TIMEOUT=10000
      - REDIS_COMMAND_TIMEOUT=5000
      
      # WebSocket Configuration
      - WS_ENABLED=true
      - WS_PORT=3001
      - WS_CORS_ORIGIN=http://localhost:3000,http://localhost:3002,http://localhost:8080
      - WS_HEARTBEAT_INTERVAL=30
      - WS_MAX_CONNECTIONS=100
      
      # VAD Configuration
      - VAD_ENABLED=true
      - VAD_SILENCE_THRESHOLD=0.3
      - VAD_SPEECH_THRESHOLD=0.5
      - VAD_MIN_SPEECH_DURATION=0.5
      - VAD_MAX_SILENCE_DURATION=2.0
      - VAD_FRAME_SIZE=1024
      - VAD_SAMPLE_RATE=16000
      
      # Audio Processing Configuration
      - AUDIO_SAMPLE_RATE=16000
      - AUDIO_CHANNELS=1
      - AUDIO_BIT_DEPTH=16
      - AUDIO_FORMAT=pcm_s16le
      - AUDIO_CHUNK_SIZE=4096
      - AUDIO_BUFFER_SIZE=8192
      - AUDIO_UPLOAD_MAX_SIZE=50MB
      - AUDIO_UPLOAD_ALLOWED_FORMATS=wav,mp3,flac,m4a,ogg
      - AUDIO_STORAGE_PATH=/app/audio_storage
      - AUDIO_CLEANUP_INTERVAL=3600
      
      # Multi-Language Support
      - SUPPORTED_LANGUAGES=en,es,fr,de,it,pt,ru,ja,ko,zh
      - DEFAULT_LANGUAGE=en
      - AUTO_DETECT_LANGUAGE=true
      - LANGUAGE_DETECTION_CONFIDENCE=0.8
      
      # Conversation History
      - CONVERSATION_HISTORY_ENABLED=true
      - CONVERSATION_HISTORY_RETENTION_DAYS=30
      - CONVERSATION_HISTORY_MAX_MESSAGES=1000
      - CONVERSATION_HISTORY_ENCRYPTION=true
      - CONVERSATION_HISTORY_BACKUP_ENABLED=true
      - CONVERSATION_HISTORY_BACKUP_INTERVAL=24
      
      # Security
      - JWT_SECRET=your-super-secret-jwt-key-min-32-chars-for-voice-chatbot
      - ENCRYPTION_KEY=your-32-char-encryption-key-here-voice
      - HASH_ROUNDS=12
      - CORS_ORIGIN=http://localhost:3000,http://localhost:3002,http://localhost:8080
      - CORS_CREDENTIALS=true
      
      # Logging
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - LOG_FILE_ENABLED=true
      - LOG_FILE_PATH=./logs/app.log
      - LOG_MAX_FILES=5
      - LOG_MAX_SIZE=10m
      
      # Rate Limiting
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      - RATE_LIMIT_SKIP_SUCCESSFUL_REQUESTS=false
      - RATE_LIMIT_VOICE_REQUESTS_PER_MINUTE=20
      
      # Feature Flags
      - FEATURE_VOICE_CHAT=true
      - FEATURE_FILE_UPLOAD=true
      - FEATURE_CONVERSATION_HISTORY=true
      - FEATURE_MULTI_LANGUAGE=true
      - FEATURE_VOICE_ACTIVITY_DETECTION=true
      - FEATURE_REAL_TIME_TRANSCRIPTION=true
      - FEATURE_TEXT_TO_SPEECH=true
      - FEATURE_AI_FALLBACK=true
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/audio_storage:/app/audio_storage
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - voice-chatbot-network

  # Ollama Local LLM
  ollama:
    image: ollama/ollama:latest
    container_name: voice-chatbot-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - voice-chatbot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voice-chatbot-frontend
    ports:
      - "8080:80" # Frontend HTTP port
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - voice-chatbot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  voice-chatbot-network:
    driver: bridge
